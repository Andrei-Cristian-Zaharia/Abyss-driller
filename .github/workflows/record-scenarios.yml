# Records Director mode scenarios (Debug build, iOS Simulator) as MP4 clips.
# Manual trigger only: the repo is public, so nothing runs on push or on PRs
# from forks. No secrets are used.
name: Record scenarios

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: "Comma-separated scenarios (bossFight,goldRush,caveIn,deepBiome,garageUpgrades) or 'all'"
        required: false
        default: all
        type: string
      duration:
        description: "Seconds per scenario: blank = per-scenario defaults (30-40 s), a number for all (e.g. 35), or overrides (e.g. bossFight=40,caveIn=32)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: record-scenarios
  cancel-in-progress: true

jobs:
  record:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      PROJECT: Abyss Driller.xcodeproj
      SCHEME: Abyss Driller
      BUNDLE_ID: com.andreizaharia.abyssdriller
      DERIVED_DATA: build/DerivedData
      SOURCE_PACKAGES: build/SourcePackages
      ALL_SCENARIOS: bossFight,goldRush,caveIn,deepBiome,garageUpgrades
      # Per-scenario clip length in seconds, used when the `duration` input
      # does not set one. The bossFight needs its intro plus a few powers,
      # deepBiome just shows the layer.
      DEFAULT_DURATIONS: bossFight=40,goldRush=35,caveIn=35,deepBiome=30,garageUpgrades=40
      MIN_DURATION: "5"
      MAX_DURATION: "120"
      # Static-clip rejection (see the validate step): most of a clip frozen,
      # a scene that changes only in a tiny area, or almost no unique frames.
      MAX_FROZEN_PCT: "30"
      MIN_CHANGED_AREA_PCT: "1.0"
      MIN_UNIQUE_PCT: "25"
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        env:
          IN_SCENARIOS: ${{ inputs.scenarios }}
          IN_DURATION: ${{ inputs.duration }}
        run: |
          set -euo pipefail
          scenarios="$(echo "${IN_SCENARIOS:-all}" | tr -d '[:space:]')"
          if [ -z "$scenarios" ] || [ "$scenarios" = "all" ]; then scenarios="$ALL_SCENARIOS"; fi
          for s in ${scenarios//,/ }; do
            case ",$ALL_SCENARIOS," in
              *",$s,"*) ;;
              *) echo "::error::Unknown scenario '$s' (allowed: $ALL_SCENARIOS)"; exit 1 ;;
            esac
          done
          # One file per scenario holding its clip length in seconds:
          # defaults first, then the input (a number for all, or s=n pairs).
          dir="$RUNNER_TEMP/durations"
          mkdir -p "$dir"
          set_duration() {
            local s="$1" d="$2"
            case ",$ALL_SCENARIOS," in
              *",$s,"*) ;;
              *) echo "::error::Unknown scenario '$s' in duration (allowed: $ALL_SCENARIOS)"; exit 1 ;;
            esac
            if ! [[ "$d" =~ ^[0-9]+$ ]] || [ "$d" -lt "$MIN_DURATION" ] || [ "$d" -gt "$MAX_DURATION" ]; then
              echo "::error::Duration for $s must be a whole number of seconds between $MIN_DURATION and $MAX_DURATION (got '$d')"; exit 1
            fi
            echo "$d" > "$dir/$s"
          }
          for kv in ${DEFAULT_DURATIONS//,/ }; do set_duration "${kv%%=*}" "${kv#*=}"; done
          duration="$(echo "${IN_DURATION:-}" | tr -d '[:space:]')"
          if [ -n "$duration" ] && [ "$duration" != "default" ]; then
            if [[ "$duration" =~ ^[0-9]+$ ]]; then
              for s in ${ALL_SCENARIOS//,/ }; do set_duration "$s" "$duration"; done
            else
              for kv in ${duration//,/ }; do
                [[ "$kv" == *=* ]] || { echo "::error::duration '$kv' is not a number or scenario=seconds"; exit 1; }
                set_duration "${kv%%=*}" "${kv#*=}"
              done
            fi
          fi
          echo "| Scenario | Seconds |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          for s in ${scenarios//,/ }; do
            echo "$s: $(cat "$dir/$s") s"
            echo "| $s | $(cat "$dir/$s") |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "SCENARIOS=$scenarios" >> "$GITHUB_ENV"
          echo "DURATIONS_DIR=$dir" >> "$GITHUB_ENV"

      - name: Select newest Xcode
        id: xcode
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_*.app | grep -vi -e beta -e release_candidate | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -cs '[:alnum:].' '-')" >> "$GITHUB_OUTPUT"

      - name: Pick and boot an iPhone simulator
        run: |
          set -euo pipefail
          # Newest iOS runtime, smallest iPhone on it. An iPhone SE is 750x1334
          # (exactly 9:16), so the runner keeps up with recording and the clip
          # scales cleanly to 1080x1920. A 3x Pro (1206x2622) made simctl drop
          # frames and write variable-rate, partly corrupt MP4s. If the runtime
          # supports an SE but none exists, one is created.
          pick="$(xcrun simctl list -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          devices = data["devices"]
          small = ["iPhone SE (3rd generation)", "iPhone SE (2nd generation)"]
          runtimes = [r for r in data["runtimes"]
                      if r.get("platform", "iOS") == "iOS" and r.get("isAvailable", True)]
          runtimes.sort(key=lambda r: [int(n) for n in r["version"].split(".") if n.isdigit()], reverse=True)
          for rt in runtimes:
              phones = [d for d in devices.get(rt["identifier"], [])
                        if d["name"].startswith("iPhone") and d.get("isAvailable", True)]
              for name in small:
                  for d in phones:
                      if d["name"] == name:
                          print("use", d["udid"]); sys.exit()
              for name in small:
                  for t in rt.get("supportedDeviceTypes", []):
                      if t["name"] == name:
                          print("create", t["identifier"], rt["identifier"]); sys.exit()
              # No SE on this runtime: avoid the heavier Pro/Plus/Max screens.
              plain = [d for d in phones if not any(w in d["name"] for w in ("Pro", "Plus", "Max", "Air"))]
              if plain or phones:
                  print("use", (plain or phones)[0]["udid"]); sys.exit()
          ')"
          read -r action a b <<<"$pick" || true
          case "${action:-}" in
            use) udid="$a" ;;
            create) udid="$(xcrun simctl create "Recorder iPhone" "$a" "$b")" ;;
            *) echo "::error::No iPhone simulator available"; exit 1 ;;
          esac
          xcrun simctl list devices | grep "$udid"
          echo "UDID=$udid" >> "$GITHUB_ENV"
          # Boot now so it comes up while the app builds.
          xcrun simctl boot "$udid"

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ env.SOURCE_PACKAGES }}
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ${{ env.DERIVED_DATA }}
          key: dd-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('Abyss Driller/**', 'Abyss Driller.xcodeproj/project.pbxproj', '**/Package.resolved') }}
          restore-keys: dd-${{ runner.os }}-${{ steps.xcode.outputs.version }}-

      - name: Build (Debug, iOS Simulator, unsigned)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -quiet

      - name: Install app
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$UDID" -b
          app="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/$SCHEME.app"
          test -d "$app"
          xcrun simctl install "$UDID" "$app"
          # Clean status bar for the menu shots (the run hides it anyway).
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 \
            --wifiBars 3 --cellularBars 4 || true

      - name: Install ffmpeg
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install ffmpeg
          fi
          ffmpeg -hide_banner -version | head -1

      - name: Record scenarios
        run: |
          set -euo pipefail
          # Job control on: without it bash starts background jobs with SIGINT
          # ignored, so `kill -INT` would never reach simctl and the MP4 would
          # be left without its index (truncated / undecodable).
          set -m
          mkdir -p raw
          for s in ${SCENARIOS//,/ }; do
            duration="$(cat "$DURATIONS_DIR/$s")"
            echo "::group::$s (${duration}s)"
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            # The autopilot's clock starts when the app appears, before the
            # recording does; it runs well past the clip, so the recording
            # never catches it winding down.
            # Director mode logs to stderr (render fps, pause state, drill and
            # camera position every second, autopilot commands); it is
            # printed below so it shows in the Actions log.
            applog="$PWD/raw/$s.director.log"
            : > "$applog"
            xcrun simctl launch --stderr="$applog" "$UDID" "$BUNDLE_ID" \
              -scenario "$s" -scenarioDuration "$((duration + 12))"
            sleep 2
            log="raw/$s.log"
            : > "$log"
            xcrun simctl io "$UDID" recordVideo --codec=h264 --force "raw/$s.mp4" >"$log" 2>&1 &
            rec=$!
            # Time the clip from when simctl actually starts capturing.
            for _ in $(seq 1 100); do
              grep -q "Recording started" "$log" && break
              kill -0 "$rec" 2>/dev/null || { cat "$log"; echo "::error::$s: recordVideo exited early"; exit 1; }
              sleep 0.1
            done
            # One spare second; the encode step trims to the exact duration.
            sleep "$((duration + 1))"
            # SIGINT makes simctl finalize the MP4; wait for it to finish
            # writing (up to 60 s) instead of killing it.
            kill -INT "$rec"
            for _ in $(seq 1 600); do
              kill -0 "$rec" 2>/dev/null || break
              sleep 0.1
            done
            if kill -0 "$rec" 2>/dev/null; then
              cat "$log"; echo "::error::$s: recordVideo did not finish after SIGINT"; exit 1
            fi
            status=0
            wait "$rec" || status=$?
            cat "$log"
            if [ "$status" -ne 0 ]; then echo "::error::$s: recordVideo exited with $status"; exit 1; fi
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
            echo "--- Director log ($s) ---"
            grep '\[Director\]' "$applog" || echo "(no Director output)"
            if grep -q 'WARNING' "$applog"; then
              echo "::warning title=Director $s::$(grep -m1 'WARNING' "$applog" | sed 's/^.*\[Director\] //')"
            fi
            test -s "raw/$s.mp4"
            ls -lh "raw/$s.mp4"
            ffprobe -v error -select_streams v:0 \
              -show_entries stream=codec_name,width,height,avg_frame_rate,r_frame_rate:format=duration \
              -of default=noprint_wrappers=1 "raw/$s.mp4"
            echo "::endgroup::"
          done

      - name: Encode clips (30 fps CFR, 1080x1920, yuv420p, faststart)
        run: |
          set -euo pipefail
          mkdir -p clips
          # Raw clips only: no text, captions or audio. Titles and voiceover
          # are added later in Asar Studio.
          vf="fps=30,scale=1080:1920:force_original_aspect_ratio=decrease:flags=lanczos"
          vf="$vf,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:color=black,setsar=1,format=yuv420p"
          for s in ${SCENARIOS//,/ }; do
            duration="$(cat "$DURATIONS_DIR/$s")"
            echo "::group::$s (${duration}s)"
            ffmpeg -hide_banner -v error -y -i "raw/$s.mp4" \
              -t "$duration" -vf "$vf" -fps_mode cfr -r 30 \
              -c:v libx264 -preset medium -crf 18 -profile:v high -pix_fmt yuv420p \
              -g 60 -an -sn -dn -map_metadata -1 -movflags +faststart \
              "clips/$s.mp4"
            ffprobe -v error -select_streams v:0 \
              -show_entries stream=codec_name,pix_fmt,width,height,avg_frame_rate,r_frame_rate,nb_frames:format=duration \
              -of default=noprint_wrappers=1 "clips/$s.mp4"
            echo "::endgroup::"
          done

      - name: Validate clips (decode, 30 fps CFR, vertical, duration, not static)
        id: validate
        run: |
          set -euo pipefail
          # Every requested scenario must have a clip that decodes with zero
          # errors, is h264 yuv420p 1080x1920 at a constant 30 fps (every
          # frame exactly 1/30 s apart), has no audio/subtitle/data streams,
          # and lasts within +/-1 s of the requested duration. The summary
          # goes to the job page and to the `clip-validation` artifact; the
          # job fails if any clip does not pass.
          mkdir -p validation
          checker="$RUNNER_TEMP/check_clip.py"
          cat > "$checker" <<'PY'
          import json, subprocess, sys
          from fractions import Fraction

          scenario, clip, requested, decode_errors = sys.argv[1], sys.argv[2], int(sys.argv[3]), int(sys.argv[4])
          FPS, WIDTH, HEIGHT, TOLERANCE = 30, 1080, 1920, 1.0
          problems = []
          if decode_errors:
              problems.append(f"{decode_errors} decode errors")

          def probe(*args):
              out = subprocess.run(["ffprobe", "-v", "error", "-of", "json", *args, clip],
                                   check=True, capture_output=True, text=True).stdout
              return json.loads(out)

          def frac(x):
              try:
                  return Fraction(x)
              except (TypeError, ValueError, ZeroDivisionError):
                  return Fraction(0)

          size = rates = step = duration = "-"
          pts = []
          try:
              info = probe("-show_entries",
                           "stream=codec_type,codec_name,pix_fmt,width,height,r_frame_rate,avg_frame_rate,time_base"
                           ":format=duration")
              streams = info.get("streams", [])
              video = [st for st in streams if st.get("codec_type") == "video"]
              others = sorted({st.get("codec_type", "?") for st in streams if st.get("codec_type") != "video"})
              if others:
                  problems.append("unexpected streams: " + ", ".join(others))
              if len(video) != 1:
                  problems.append(f"{len(video)} video streams")
              if video:
                  v = video[0]
                  w, h = int(v.get("width", 0)), int(v.get("height", 0))
                  size = f"{w}x{h}"
                  if (w, h) != (WIDTH, HEIGHT):
                      problems.append(f"size {size}, expected {WIDTH}x{HEIGHT} (vertical)")
                  if v.get("codec_name") != "h264":
                      problems.append(f"codec {v.get('codec_name')}, expected h264")
                  if v.get("pix_fmt") != "yuv420p":
                      problems.append(f"pix_fmt {v.get('pix_fmt')}, expected yuv420p")
                  r, avg = frac(v.get("r_frame_rate")), frac(v.get("avg_frame_rate"))
                  rates = f"{float(r):.3f} / {float(avg):.3f}"
                  if r != FPS or abs(float(avg) - FPS) > 0.05:
                      problems.append(f"frame rate {rates}, expected {FPS}")
                  # Constant frame rate: sorted presentation timestamps must
                  # all be one frame apart (1 tick of slack for rounding).
                  tb = frac(v.get("time_base"))
                  pts = sorted(int(p["pts"]) for p in
                               probe("-select_streams", "v:0", "-show_entries", "packet=pts").get("packets", [])
                               if str(p.get("pts", "")).lstrip("-").isdigit())
                  diffs = [b - a for a, b in zip(pts, pts[1:])]
                  if tb <= 0 or not diffs:
                      problems.append("no frame timestamps")
                  else:
                      expected = 1 / (tb * FPS)
                      lo, hi = min(diffs), max(diffs)
                      step = f"{float(lo * tb * 1000):.2f}-{float(hi * tb * 1000):.2f} ms"
                      if lo < expected - 1 or hi > expected + 1:
                          problems.append(f"variable frame spacing {step}, expected {float(1000 / FPS):.2f} ms")
              d = float(info.get("format", {}).get("duration", "nan"))
              duration = f"{d:.2f}s"
              if not abs(d - requested) <= TOLERANCE:
                  problems.append(f"duration {duration}, expected {requested}s +/- {TOLERANCE:g}s")
          except (subprocess.CalledProcessError, ValueError, KeyError) as e:
              problems.append(f"ffprobe failed: {e}")

          # Static-clip check. A recording where the world layer stopped
          # redrawing still changes a little (HUD text, the joystick knob),
          # so the decode/format checks above pass; these do not.
          #  - freezedetect (noise 0.003, >= 2 s): share of the clip frozen.
          #  - changed area: per frame, % of pixels whose luma moved by more
          #    than 10 vs the previous frame; the largest value in each
          #    second, then the median of those (duplicate frames from a
          #    slow simulator do not drag it down).
          #  - mpdecimate: share of frames that differ from the last kept one.
          import os, re, statistics
          MAX_FROZEN = float(os.environ.get("MAX_FROZEN_PCT", "30"))
          MIN_AREA = float(os.environ.get("MIN_CHANGED_AREA_PCT", "1.0"))
          MIN_UNIQUE = float(os.environ.get("MIN_UNIQUE_PCT", "25"))
          frozen_txt = area_txt = unique_txt = "-"

          def ffmpeg_filter(vf, level="info", fmt="null"):
              run = subprocess.run(["ffmpeg", "-hide_banner", "-nostdin", "-v", level, "-i", clip,
                                    "-map", "0:v:0", "-vf", vf, "-fps_mode", "passthrough", "-f", fmt, "-"],
                                   capture_output=True, text=True)
              return run.stdout, run.stderr

          try:
              clip_len = float(duration.rstrip("s")) if duration != "-" else float(requested)
              _, err = ffmpeg_filter("freezedetect=n=0.003:d=2")
              frozen, start = 0.0, None
              for m in re.finditer(r"freeze_(start|end): ([0-9.]+)", err):
                  if m.group(1) == "start":
                      start = float(m.group(2))
                  elif start is not None:
                      frozen += float(m.group(2)) - start
                      print(f"{scenario}: frozen {start:.2f}-{float(m.group(2)):.2f}s", file=sys.stderr)
                      start = None
              if start is not None:                      # still frozen at the end
                  frozen += max(0.0, clip_len - start)
                  print(f"{scenario}: frozen {start:.2f}s-end", file=sys.stderr)
              frozen_pct = 100 * frozen / clip_len if clip_len > 0 else 100
              frozen_txt = f"{frozen_pct:.1f}%"
              if frozen_pct > MAX_FROZEN:
                  problems.append(f"static clip: {frozen_txt} frozen (freezedetect n=0.003 d=2), max {MAX_FROZEN:g}%")

              _, err = ffmpeg_filter("format=gray,tblend=all_mode=difference,blackframe=amount=0:threshold=10")
              per_second = {}
              for m in re.finditer(r"pblack:(\d+)\S*\s.*?\bt:([0-9.]+)", err):
                  sec = int(float(m.group(2)))
                  per_second[sec] = max(per_second.get(sec, 0.0), 100.0 - float(m.group(1)))
              if per_second:
                  area = statistics.median(per_second.values())
                  area_txt = f"{area:.2f}%"
                  if area < MIN_AREA:
                      problems.append(f"scene changes only in a tiny area: median {area_txt} of pixels per second, min {MIN_AREA:g}%")
              else:
                  problems.append("changed-area analysis produced no data")

              out, _ = ffmpeg_filter("mpdecimate", level="error", fmt="framemd5")
              kept = sum(1 for line in out.splitlines() if line and not line.startswith("#"))
              total = len(pts) or kept
              unique = 100 * kept / total if total else 0
              unique_txt = f"{unique:.0f}% ({kept}/{total})"
              if unique < MIN_UNIQUE:
                  problems.append(f"only {unique_txt} unique frames (mpdecimate), min {MIN_UNIQUE:g}%")
          except (OSError, ValueError) as e:
              problems.append(f"motion analysis failed: {e}")

          result = "PASS" if not problems else "FAIL: " + "; ".join(problems)
          print(f"| {scenario} | {decode_errors} | {size} | {rates} | {step} | {duration} ({requested}s) "
                f"| {frozen_txt} | {area_txt} | {unique_txt} | {result} |")
          for p in problems:
              print(f"::error title=Clip {scenario} failed validation::{p}", file=sys.stderr)
          sys.exit(1 if problems else 0)
          PY
          summary=validation/summary.md
          {
            echo "## Clip validation"
            echo
            echo "| Scenario | Decode errors | Size | FPS (r / avg) | Frame spacing | Duration (requested) | Frozen | Changed area | Unique frames | Result |"
            echo "| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |"
          } > "$summary"
          failed=0
          for s in ${SCENARIOS//,/ }; do
            clip="clips/$s.mp4"
            requested="$(cat "$DURATIONS_DIR/$s")"
            if [ ! -s "$clip" ]; then
              echo "::error title=Clip $s failed validation::missing clip"
              echo "| $s | - | - | - | - | - (${requested}s) | - | - | - | FAIL: missing clip |" >> "$summary"
              failed=1
              continue
            fi
            # Full decode of the video stream; every line ffmpeg prints at
            # level `error` counts, and so does a non-zero exit.
            errlog="validation/$s.decode.log"
            ffmpeg -hide_banner -nostdin -v error -i "$clip" -map 0:v:0 -f null - 2>"$errlog" \
              || echo "ffmpeg exited with status $?" >> "$errlog"
            errors="$(grep -c . "$errlog" || true)"
            if [ "$errors" -gt 0 ]; then head -20 "$errlog"; fi
            if ! python3 "$checker" "$s" "$clip" "$requested" "$errors" >> "$summary"; then failed=1; fi
          done
          {
            echo
            if [ "$failed" -eq 0 ]; then echo "All clips passed."; else echo "**Some clips failed validation.**"; fi
          } >> "$summary"
          cp raw/*.director.log validation/ 2>/dev/null || true
          cat "$summary"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          ls -lh clips || true
          exit "$failed"

      - name: Upload validation summary
        if: always() && steps.validate.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: clip-validation
          path: validation/
          retention-days: 1
          if-no-files-found: warn

      # Clips that failed validation go to a separate artifact for diagnosis,
      # so nothing downstream imports them as good clips.
      - name: Upload rejected clips
        if: failure() && steps.validate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rejected-clips
          path: clips/*.mp4
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload clips
        uses: actions/upload-artifact@v4
        with:
          name: scenario-clips
          path: clips/*.mp4
          retention-days: 1
          if-no-files-found: error
