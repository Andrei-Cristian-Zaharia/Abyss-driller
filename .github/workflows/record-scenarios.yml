# Records Director mode scenarios (Debug build, iOS Simulator) as MP4 clips.
# Manual trigger only: the repo is public, so nothing runs on push or on PRs
# from forks. No secrets are used.
name: Record scenarios

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: "Comma-separated scenarios (bossFight,goldRush,caveIn,deepBiome,garageUpgrades) or 'all'"
        required: false
        default: all
        type: string
      duration:
        description: "Seconds to record per scenario"
        required: false
        default: "20"
        type: string

permissions:
  contents: read

concurrency:
  group: record-scenarios
  cancel-in-progress: true

jobs:
  record:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      PROJECT: Abyss Driller.xcodeproj
      SCHEME: Abyss Driller
      BUNDLE_ID: com.andreizaharia.abyssdriller
      DERIVED_DATA: build/DerivedData
      SOURCE_PACKAGES: build/SourcePackages
      ALL_SCENARIOS: bossFight,goldRush,caveIn,deepBiome,garageUpgrades
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        env:
          IN_SCENARIOS: ${{ inputs.scenarios }}
          IN_DURATION: ${{ inputs.duration }}
        run: |
          set -euo pipefail
          scenarios="$(echo "${IN_SCENARIOS:-all}" | tr -d '[:space:]')"
          if [ -z "$scenarios" ] || [ "$scenarios" = "all" ]; then scenarios="$ALL_SCENARIOS"; fi
          for s in ${scenarios//,/ }; do
            case ",$ALL_SCENARIOS," in
              *",$s,"*) ;;
              *) echo "::error::Unknown scenario '$s' (allowed: $ALL_SCENARIOS)"; exit 1 ;;
            esac
          done
          duration="${IN_DURATION:-20}"
          if ! [[ "$duration" =~ ^[0-9]+$ ]] || [ "$duration" -lt 3 ] || [ "$duration" -gt 120 ]; then
            echo "::error::duration must be a whole number of seconds between 3 and 120"; exit 1
          fi
          echo "SCENARIOS=$scenarios" >> "$GITHUB_ENV"
          echo "DURATION=$duration" >> "$GITHUB_ENV"

      - name: Select newest Xcode
        id: xcode
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_*.app | grep -vi -e beta -e release_candidate | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -cs '[:alnum:].' '-')" >> "$GITHUB_OUTPUT"

      - name: Pick and boot an iPhone simulator
        run: |
          set -euo pipefail
          # Newest iOS runtime, first available iPhone on it.
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys, re
          data = json.load(sys.stdin)["devices"]
          def version(runtime):
              return [int(n) for n in re.findall(r"\d+", runtime.split("iOS-")[-1])]
          for runtime in sorted((r for r in data if ".iOS-" in r), key=version, reverse=True):
              phones = [d for d in data[runtime] if d["name"].startswith("iPhone") and d.get("isAvailable", True)]
              pro = [d for d in phones if "Pro" in d["name"] and "Max" not in d["name"]]
              pick = (pro or phones)
              if pick:
                  print(pick[0]["udid"]); break
          ')"
          if [ -z "$udid" ]; then echo "::error::No iPhone simulator available"; exit 1; fi
          xcrun simctl list devices | grep "$udid"
          echo "UDID=$udid" >> "$GITHUB_ENV"
          # Boot now so it comes up while the app builds.
          xcrun simctl boot "$udid"

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ env.SOURCE_PACKAGES }}
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ${{ env.DERIVED_DATA }}
          key: dd-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('Abyss Driller/**', 'Abyss Driller.xcodeproj/project.pbxproj', '**/Package.resolved') }}
          restore-keys: dd-${{ runner.os }}-${{ steps.xcode.outputs.version }}-

      - name: Build (Debug, iOS Simulator, unsigned)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -quiet

      - name: Install app
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$UDID" -b
          app="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/$SCHEME.app"
          test -d "$app"
          xcrun simctl install "$UDID" "$app"
          # Clean status bar for the menu shots (the run hides it anyway).
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 \
            --wifiBars 3 --cellularBars 4 || true

      - name: Record scenarios
        run: |
          set -euo pipefail
          mkdir -p clips
          for s in ${SCENARIOS//,/ }; do
            echo "::group::$s"
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            # The app keeps its autopilot going a little longer than the clip,
            # so the recording never catches it winding down.
            xcrun simctl launch "$UDID" "$BUNDLE_ID" -scenario "$s" -scenarioDuration "$((DURATION + 4))"
            sleep 2
            xcrun simctl io "$UDID" recordVideo --codec=h264 --force "clips/$s.mp4" &
            rec=$!
            sleep "$DURATION"
            # SIGINT lets simctl finish writing the MP4.
            kill -INT "$rec"
            wait "$rec" || true
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
            test -s "clips/$s.mp4"
            ls -lh "clips/$s.mp4"
            echo "::endgroup::"
          done

      - name: Upload clips
        uses: actions/upload-artifact@v4
        with:
          name: scenario-clips
          path: clips/*.mp4
          retention-days: 1
          if-no-files-found: error
